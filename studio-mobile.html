</style><header><b>판형</b><span>비즈니스 이미지 스튜디오</span></header><main><h1>이미지 제작실</h1><p>만들고 싶은 이미지의 용도를 선택하세요.</p><nav class="tabs" aria-label="이미지 용도"></nav><div class="grid"><section class="panel"><button id="example">예시 불러오기</button><small id="en"></small><h2 id="title"></h2><div id="fields"></div><label for="ratio">출력 비율</label><select id="ratio"></select></section><section class="panel side"><small>ART DIRECTION</small><h2>제작 지침</h2><p id="rules"></p><label for="model">제작 모델</label><select id="model"><option value="gpt-6-astra">Astra</option><option value="gpt-6.1-sol">Sol</option></select><p id="mode"></p><div class="actions"><button class="primary" id="generate">이미지 생성</button><button id="copy">지시문 복사</button><a class="btn" href="https://chatgpt.com/" target="_blank" rel="noopener">ChatGPT 열기 ↗</a></div><div id="status" role="status"></div><details><summary>현재 제작 지시문</summary><pre id="brief"></pre></details><div id="result"></div></section></div><footer>참고 자료 · @ai.design_rachael의 용도별 디자인 카드 8종</footer></main><script>
const templates = [
  {
    name: 'SNS 캠페인', english: 'Social campaign', ratio: '4:5',
    fields: {'브랜드·업종':'골프컴포레 · 골프용품', '타깃 고객':'주말 라운딩을 즐기는 골퍼', '핵심 메시지·목적':'새 시즌 그립 교체 캠페인', '헤드라인':'손끝에서 시작하는 새 시즌', '보조 문구·CTA':'컬러 그립 컬렉션 / 컬렉션 보기', '채널·혜택·계정':'인스타그램 피드', '메인 비주얼·로고 위치':'그립 표면의 패턴 / 우하단', '브랜드 분위기·색상':'선명한, 활동적인, 간결한 / 블랙·오프화이트·라임'},
    rules:'헤드라인, 대표 이미지, 보조 문구, 행동 유도 문구 순으로 읽히게 한다. 주색·보조색·강조색의 면적을 달리하고 로고 자리를 확보한다. 정렬과 여백을 일관되게 유지하고 장식 아이콘과 과한 그라데이션을 줄인다.'
  },
  {
    name:'제품 광고',english:'Product advertisement',ratio:'1:1',
    fields:{'제품명·종류':'에어홀 그립 / 골프 그립','타깃·핵심 장점':'골퍼 / 손에 닿는 패턴','제품 배치·배경':'오른쪽, 차콜 스튜디오','조명·카메라 앵글':'부드러운 측광, 3/4 클로즈업','헤드라인·보조 문구':'손끝의 디테일','혜택·CTA':'제품 보기','브랜드 색상·매체':'라임 / 디지털 광고'},

  },
  {
    name:'행사 포스터',english:'Event poster',ratio:'A3',
    fields:{'행사명':'디자인 오픈 스튜디오','주제·참석 대상':'독립 디자인 / 창작자','날짜·시간':'11월 21일 오후 2시','장소':'스튜디오 라운지','연사·호스트':'디자인팀','가장 중요한 정보·CTA':'일시 / 참가 신청','분위기·매체':'에디토리얼 / A3 인쇄'},
    rules:'하나의 강한 이미지와 명확한 그리드를 사용한다. 행사 제목, 일시·장소, 연사, 신청 동선을 분리하고 우선 정보가 먼저 읽히게 한다. 작은 글씨, 전면 중앙 정렬, 상투적인 행사 아이콘을 피한다.'
  },
  {
    name:'유튜브 썸네일',english:'YouTube thumbnail',ratio:'16:9',
    fields:{'영상 제목·주제':'골프 그립을 고르는 방법','시청자':'입문 골퍼','핵심 결과·감정':'내 손에 맞는 그립을 찾는 자신감','썸네일 문구':'그립 고르는 법','피사체·좌우 위치':'왼쪽에 그립, 오른쪽에 글자','표정·포즈':'패턴을 가리키는 손'},
    rules:'모바일에서 1초 안에 읽히도록 문구를 2~5단어로 짧게 잡는다. 피사체와 배경을 분리하고 핵심 요소는 최대 세 가지로 제한한다. 제목 전체 반복, 작은 글씨, 화살표 장식을 피한다. 색상 변경에 그치지 않는 서로 다른 콘셉트 세 가지를 각각 제작한다.'
  },
  {
    name:'책 표지',english:'Book cover',ratio:'2:3',
    fields:{'책 제목':'느린 궤도','부제':'계절을 기록하는 일','저자':'이서우','장르·독자':'에세이 / 일상의 기록을 좋아하는 독자','핵심 주제·분위기':'계절의 반복 / 고요한','표현 방식·서체':'추상 일러스트 / 명조'},
    rules:'대표 이미지 하나로 주제를 전달한다. 장르와 시대감에 맞는 글꼴로 제목·부제·저자명의 크기를 구분한다. 앞표지와 작은 화면에서 제목이 살아나는 단순화 썸네일을 함께 제작한다. 뻔한 상징과 장르 클리셰를 줄인다.'
  },
  {
    name:'메뉴판',english:'Restaurant menu',ratio:'A4',
    fields:{'가게명':'여백 식당','요리·분위기':'제철 한식 / 편안한','섹션·메뉴·설명·가격':'메인 | 버섯 솥밥 | 제철 버섯 | 14,000원\n음료 | 매실차 | 5,000원','식이 정보':'','시그니처 메뉴':'버섯 솥밥','스타일·색상·매체':'먹색과 미색 / A4 단면'},
    rules:'섹션, 메뉴명, 설명, 가격, 식이 정보를 단계별로 배치한다. 가격은 메뉴명보다 작게 하되 같은 열에 정렬한다. 섹션은 여백으로 나누고 추천 메뉴에 한 가지 강조만 쓴다. 제공된 가격을 보존하고 식이·알레르기 정보를 추정하지 않는다.'
  },
  {
    name:'인포그래픽',english:'Infographic',ratio:'9:16',
    fields:{'주제':'원료 구매 검토 절차','대상·핵심 내용':'신입 바이어 / 구매 전 점검 순서','섹션 순서':'수요 확인 → 재고 점검 → 오퍼 비교 → 일정 확인 → 발주','정보 구조':'단계별 과정','강조 수치·단위·출처':'','컬러·서체':'남색과 민트 / 고딕'},
    rules:'2분 안에 핵심을 이해하도록 위에서 아래로 하나의 흐름을 만든다. 단계·비교·통계 중 자료에 맞는 구조를 사용한다. 수치·단위·출처를 그대로 유지한다. 설명에 필요한 차트만 사용하고 장식 차트, 3D 효과와 반복 아이콘은 생략한다.'
  },
  {
    name:'모바일 앱 화면',english:'Mobile app screen',ratio:'9:19.5',
    fields:{'앱 이름·주요 기능':'포트 로그 / 입항 일정 확인','화면 종류':'대시보드','핵심 행동':'오늘의 입항 확인','보조 행동':'날짜 변경, 선박 검색','스타일·구조':'간결한 리스트','기기·해상도':'폴드 커버 화면','실제 예시 콘텐츠':'예시 선박 A / 입항 예정 09:30'},
    rules:'내비게이션, 제목, 주요 정보, 보조 정보, 버튼의 위계를 구분한다. 주요 행동은 엄지가 닿는 영역에 두고 기기 폭에 맞춰 구성한다. 현실적인 예시 문구를 쓴다. 중복 카드, 과도한 둥근 모서리, 장식 아이콘과 불필요한 그라데이션을 줄인다.'
  }
];

</script><script>
'use strict';
const byId = id => document.getElementById(id);
const ratios = {'1:1':[1080,1080],'4:5':[1080,1350],'9:16':[1080,1920],'16:9':[1280,720],'2:3':[1200,1800],'9:19.5':[1080,2340],A4:[2480,3508],A3:[3508,4961]};
let active = 0, busy = false, local = false;
let drafts = {}, preferred = 'gpt-6-astra';
try {
  drafts = JSON.parse(localStorage.getItem('panhyeong.drafts') || '{}') || {};
  preferred = localStorage.getItem('panhyeong.model') || preferred;
} catch {}
function save() {
  try {
    localStorage.setItem('panhyeong.drafts', JSON.stringify(drafts));
    localStorage.setItem('panhyeong.model', byId('model').value);
  } catch {}
}
function brief() {
  const t = templates[active], d = drafts[active];
  const entries = Object.keys(t.fields).filter(k => d[k]?.trim()).map(k => k + ' — ' + d[k].trim());
  return [t.name + ' 제작 요청', '출력 형식 ' + d.ratio + ' (' + ratios[d.ratio].join(' × ') + ' px)', ...entries, '', t.rules, '입력한 고유명사·가격·날짜와 문구를 보존한다. 제공되지 않은 수치나 혜택을 만들지 않는다. 최종 이미지를 제작한다.'].join('\n');
}
function refresh() { byId('brief').textContent = brief(); save(); }
function show() {
  const t = templates[active];
  const d = drafts[active] ||= {};
  if (!ratios[d.ratio]) d.ratio = t.ratio;
  document.querySelectorAll('nav button').forEach((b,i) => b.setAttribute('aria-pressed', String(active === i)));
  byId('title').textContent = t.name; byId('en').textContent = t.english.toUpperCase();
  byId('rules').textContent = t.rules; byId('ratio').value = d.ratio;
  byId('result').replaceChildren(); byId('status').textContent = '';
  byId('fields').replaceChildren();
  Object.entries(t.fields).forEach(([key,example],i) => {
    const label = document.createElement('label'), input = document.createElement('textarea');
    input.id = 'field-' + i; label.htmlFor = input.id; label.textContent = key;
    input.rows = 1; input.placeholder = example ? '예: ' + example : '해당하는 경우 입력'; input.value = d[key] || '';
    input.oninput = () => { d[key] = input.value; refresh(); };
    byId('fields').append(label,input);
  });
  refresh();
}
templates.forEach((t,i) => {
  const b = document.createElement('button'); b.textContent = t.name;
  b.onclick = () => { active=i; show(); }; document.querySelector('nav').append(b);
});
Object.keys(ratios).forEach(r => byId('ratio').add(new Option(r,r)));
byId('ratio').onchange = e => { drafts[active].ratio=e.target.value; refresh(); };
byId('model').value = ['gpt-6-astra','gpt-6.1-sol'].includes(preferred) ? preferred : 'gpt-6-astra';
function modelHint() {
  const label = byId('model').selectedOptions[0].text;
  byId('mode').textContent = local ? label + '로 그래픽 시안을 제작해 PNG로 저장합니다.' : '지시문을 복사하고 ChatGPT에서 ' + label + '을 직접 선택해 전송하세요.';
}
byId('model').onchange = () => { save(); modelHint(); };
byId('example').onclick = () => {
  const t = templates[active];
  if (Object.keys(t.fields).some(k => drafts[active][k]) && !confirm('현재 입력을 예시로 바꿀까요?')) return;
  Object.assign(drafts[active],t.fields); show();
};
async function copy() {
  try { await navigator.clipboard.writeText(brief()); byId('status').textContent = '지시문을 복사했습니다. ChatGPT에서 선택한 모델을 확인하고 붙여 넣으세요.'; }
  catch { document.querySelector('details').open=true; const range=document.createRange(); range.selectNodeContents(byId('brief')); const sel=getSelection(); sel.removeAllRanges(); sel.addRange(range); byId('status').textContent='선택된 지시문을 복사하세요.'; }
}
byId('copy').onclick = copy;
async function png(svg, size) {
  const url=URL.createObjectURL(new Blob([svg],{type:'image/svg+xml;charset=utf-8'}));
  try {
    const img=new Image(); img.src=url; await img.decode();
    const canvas=document.createElement('canvas'); [canvas.width,canvas.height]=size;
    canvas.getContext('2d').drawImage(img,0,0,...size);
    return await new Promise((resolve,reject)=>canvas.toBlob(b=>b?resolve(b):reject(Error('PNG 변환 실패')),'image/png'));
  } finally { URL.revokeObjectURL(url); }
}
const files=[];
function clearFiles(){ files.splice(0).forEach(u=>URL.revokeObjectURL(u)); }
byId('generate').onclick = async () => {
  if(busy) return;
  if(!Object.keys(templates[active].fields).some(k=>drafts[active][k]?.trim())) {byId('status').textContent='제작할 내용을 한 항목 이상 입력하거나 예시를 불러오세요.'; return;}
  if(!local){await copy();return;}
  busy=true;
  const controls=[...document.querySelectorAll('button,textarea,select')]; controls.forEach(e=>e.disabled=true);
  byId('status').textContent='선택한 모델이 시안을 제작 중입니다. 이 화면을 열어 두세요.';
  const output=byId('result'); output.replaceChildren(); clearFiles();
  try {
    const res=await fetch('/generate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model:byId('model').value,brief:brief(),kind:active})});
    const data=await res.json(); if(!res.ok) throw Error(data.error || '생성 실패');
    for(const [i,svg] of data.images.entries()){
      const blob=await png(svg,ratios[drafts[active].ratio]); const url=URL.createObjectURL(blob); files.push(url);
      const img=new Image(); img.src=url; img.alt=templates[active].name+' 시안 '+(i+1);
      const link=document.createElement('a'); link.href=url; link.download=templates[active].name+'-'+(i+1)+'.png'; link.textContent='시안 '+(i+1)+' PNG 저장'; output.append(img,link);
    }
    byId('status').textContent=data.images.length+'개 시안을 완성했습니다.';
  } catch(err){byId('status').textContent=err.message;}
  finally {busy=false; controls.forEach(e=>e.disabled=false);}
};
show();
async function detect(){
  if(location.hostname==='127.0.0.1' && location.protocol==='http:'){
    try{local=(await (await fetch('/mode')).json()).studio===true;}catch{}
  }
  modelHint();
  if(!local){byId('generate').hidden=true;}
}
detect();

</script></html>
